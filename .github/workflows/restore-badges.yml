name: Restore original profile badges
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-badges.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original Shields SVG files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, html, pathlib, re, subprocess, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          original = subprocess.check_output(['git','show','59c240626b2b1194e509abe932ddd48a4d583453:README.md'], text=True)
          current = pathlib.Path('README.md').read_text()
          urls = {name: html.unescape(url) for url,name in re.findall(r'<img src="([^"]+)" alt="([^"]+)"', original)}
          targets = re.findall(r'<img src="(assets/badges/[^"]+)" alt="([^"]+)"', current)
          assert len(targets) == 76
          def fetch(url):
              for i in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'profile-badge-restore/1.0','Accept':'image/svg+xml'})
                      with urllib.request.urlopen(req, timeout=20) as res:
                          raw=res.read()
                      root=ET.fromstring(raw)
                      if root.tag.split('}')[-1]!='svg': raise ValueError('not SVG')
                      return raw,root
                  except Exception:
                      if i == 3: raise
                      time.sleep(2**i)
          def restore(target):
              path,name=target
              url=urls[name]
              if name=='scikit-learn': url=url.replace('scikit-learn-','scikit--learn-')
              old=pathlib.Path(path).read_text()
              query=urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)
              logo=query['logo'][0]
              color=query['logoColor'][0]
              if re.fullmatch(r'[0-9a-fA-F]{6}',color): color='#'+color
              try:
                  raw,root=fetch(url)
                  if not any(e.tag.split('}')[-1]=='image' for e in root.iter()):
                      raise ValueError('missing logo')
              except Exception:
                  # Supply a logo directly when Shields no longer recognises its slug.
                  source=None
                  for slug in [logo]:
                      try:
                          icon,ir=fetch('https://raw.githubusercontent.com/simple-icons/simple-icons/13.21.0/icons/'+slug+'.svg')
                          p=next(e for e in ir.iter() if e.tag.split('}')[-1]=='path')
                          source='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="'+color+'" d="'+p.attrib['d']+'"/></svg>'
                          break
                      except Exception: pass
                  if source is None:
                      m=re.search(r'<path d="([^"]+)"',old)
                      if m: source='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="'+color+'" d="'+m.group(1)+'"/></svg>'
                      else:
                          m=re.search(r'<svg x="8" y="6" width="16" height="16" viewBox="([^"]+)">(.*?)</svg>',old,re.S)
                          if m:
                              body=re.sub(r'fill="(?!none")[^"]+"', 'fill="'+color+'"',m.group(2))
                              source='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+m.group(1)+'" fill="'+color+'">'+body+'</svg>'
                  if source is None: raise RuntimeError('No logo source for '+name)
                  u=urllib.parse.urlsplit(url)
                  query['logo']=['data:image/svg+xml;base64,'+base64.b64encode(source.encode()).decode()]
                  query.pop('logoColor',None)
                  raw,root=fetch(urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,urllib.parse.urlencode(query,doseq=True),'')))
                  if not any(e.tag.split('}')[-1]=='image' for e in root.iter()): raise RuntimeError('No embedded logo for '+name)
              if root.attrib.get('height')!='28': raise RuntimeError('Unexpected height for '+name)
              if b'javascript:' in raw.lower() or b'<script' in raw.lower(): raise RuntimeError('Unsafe SVG')
              return path,raw
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(restore,targets))
          for path,raw in results:
              pathlib.Path(path).write_bytes(raw)
              print(path)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/badges
          if ! git diff --cached --quiet; then
            git commit -m "docs: restore original Shields badge artwork"
            git push origin HEAD:main
          fi
